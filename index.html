<title>Helix Bootcamp Calendar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eaeeed; --surface:#ffffff; --surface2:#f5f8f7; --surface3:#e3e9e7;
  --ink:#0f1618; --ink2:#4c5c62; --ink3:#75868c; --line:#d3dcda; --line2:#c0cbc8;
  --apac:#0d7468; --emea:#3f4fa8; --amer:#a94c1b; --ww:#5a6a72;
  --apac-bg:#dceeeb; --emea-bg:#e2e5f7; --amer-bg:#f6e4d9; --ww-bg:#e3e8ea;
  --accent:#b07d20; --accent-bg:#f7ecd4;
  --shadow:0 1px 2px rgba(16,32,36,.06),0 8px 24px -12px rgba(16,32,36,.18);
  --r:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1315; --surface:#151e21; --surface2:#1b262a; --surface3:#233036;
  --ink:#e7eeec; --ink2:#a3b4b8; --ink3:#78898f; --line:#26343a; --line2:#33454b;
  --apac:#4fc0b0; --emea:#8b98ea; --amer:#e0895c; --ww:#93a5ad;
  --apac-bg:#0f312d; --emea-bg:#1d2450; --amer-bg:#3a2115; --ww-bg:#212d33;
  --accent:#e0b155; --accent-bg:#33280f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0d1315; --surface:#151e21; --surface2:#1b262a; --surface3:#233036;
  --ink:#e7eeec; --ink2:#a3b4b8; --ink3:#78898f; --line:#26343a; --line2:#33454b;
  --apac:#4fc0b0; --emea:#8b98ea; --amer:#e0895c; --ww:#93a5ad;
  --apac-bg:#0f312d; --emea-bg:#1d2450; --amer-bg:#3a2115; --ww-bg:#212d33;
  --accent:#e0b155; --accent-bg:#33280f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,ui-sans-serif,system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}

header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 20px 0}
.topRow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px}
.brand h1{font-size:20px;font-weight:700}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.kpis{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.kpi{min-width:60px}
.kpi b{display:block;font-family:Archivo;font-size:21px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.kpi span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);margin-top:1px}
.tabs{display:flex;gap:2px;margin-top:12px}
.tab{padding:8px 14px 9px;font-family:Archivo;font-weight:600;font-size:13px;color:var(--ink2);
  border-bottom:2px solid transparent;border-radius:var(--r) var(--r) 0 0}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);margin-left:5px}

main{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start}
aside{position:sticky;top:113px;max-height:calc(100vh - 113px);overflow-y:auto;
  padding:18px 16px 40px;border-right:1px solid var(--line);background:var(--surface)}
.pane{padding:14px 24px 60px;min-width:0}

.fgroup{margin-bottom:18px}
.fgroup>.eyebrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.fgroup .clr{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em}
.fgroup .clr:hover{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line2);background:var(--surface);font-size:12.5px;color:var(--ink2);
  transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none}
.chip .ct{font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.62}
.chip.r-APAC .dot{background:var(--apac)} .chip.r-EMEA .dot{background:var(--emea)}
.chip.r-AMER .dot{background:var(--amer)} .chip.r-WW .dot{background:var(--ww)}
.chip[aria-pressed="true"] .dot{background:var(--surface)}
.reset{width:100%;margin-top:6px;padding:7px;border:1px solid var(--line2);border-radius:var(--r);
  font-family:Archivo;font-weight:600;font-size:12.5px;color:var(--ink2)}
.reset:hover{border-color:var(--ink3);color:var(--ink);background:var(--surface2)}
.legend{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.55}

.mstrip{position:sticky;top:113px;z-index:20;background:var(--paper);padding:4px 0 8px;
  margin:-4px 0 4px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.mstrip button{flex:none;padding:4px 8px 5px;border-radius:5px;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--ink3);white-space:nowrap;border:1px solid transparent}
.mstrip button:hover{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.mstrip button.now{color:var(--accent);font-weight:600}
.mstrip button b{font-weight:600;color:var(--ink2);margin-left:4px}
.monthHead{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;padding-bottom:6px;
  border-bottom:1px solid var(--line);scroll-margin-top:162px}
.monthHead:first-of-type{margin-top:4px}
.monthHead h2{font-size:15px;font-weight:700}
.monthHead .yr{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}
.monthHead .meta{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);padding-left:5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:72px;
  padding:5px 5px 6px;display:flex;flex-direction:column;gap:4px}
.cell.pad{background:transparent;border-color:transparent}
.cell.wknd{background:var(--surface2)}
.cell .dnum{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);padding-left:2px}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.today .dnum{color:var(--accent);font-weight:600}
.sess{display:block;width:100%;text-align:left;border-radius:5px;padding:5px 7px 6px;
  border-left:3px solid var(--rc,var(--ww));background:var(--rbg,var(--ww-bg));
  transition:transform .1s,box-shadow .1s}
.sess:hover{transform:translateX(1px);box-shadow:var(--shadow)}
.sess .nm{font-family:Archivo;font-weight:600;font-size:11.5px;line-height:1.25;color:var(--ink);
  display:block;overflow-wrap:anywhere}
.sess .sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--rc,var(--ink2));
  display:block;margin-top:2px;letter-spacing:.03em}
.sess.isPast{opacity:.58}
.sess.isPast:hover{opacity:1}
.emptyMonths{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);
  padding:7px 0 0;border-top:1px dashed var(--line2);margin-top:18px}

.tlWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tl{border-collapse:separate;border-spacing:0;min-width:100%}
table.tl th,table.tl td{border-bottom:1px solid var(--line);padding:0}
table.tl thead th{position:sticky;top:0;background:var(--surface2);z-index:2;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:500;color:var(--ink3);
  letter-spacing:.05em;text-align:left;padding:7px 6px;white-space:nowrap;border-bottom:1px solid var(--line2)}
table.tl th.lane{position:sticky;left:0;background:var(--surface);z-index:3;min-width:170px;
  font-family:Archivo;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left;padding:9px 12px;
  border-right:1px solid var(--line)}
table.tl thead th.lane{z-index:4;background:var(--surface2);font-family:"IBM Plex Mono",monospace}
table.tl td{padding:5px 3px;vertical-align:middle;min-width:34px}
table.tl tbody tr:hover th.lane{background:var(--surface2)}
.node{display:block;padding:3px 2px;border-radius:5px;text-align:center}
.node:hover{background:var(--surface3)}
.node .bub{display:block;width:100%;height:6px;border-radius:99px;background:var(--rc);margin-bottom:2px}
.node .dd{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--ink2)}
.node.isPast .bub{opacity:.45} .node.isPast .dd{color:var(--ink3)}
td.qEdge,th.qEdge{border-left:1px solid var(--line2)}

.tblWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:8px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line2);white-space:nowrap;z-index:1}
table.data th.sortable{cursor:pointer}
table.data th.sortable:hover{color:var(--ink)}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tbody tr:hover{background:var(--surface2)}
table.data tbody tr.clickable{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;
  font-family:"IBM Plex Mono",monospace;font-weight:500;background:var(--rbg,var(--ww-bg));color:var(--rc,var(--ww))}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-family:"IBM Plex Mono",monospace;
  background:var(--surface3);color:var(--ink2)}
.tag.up{background:var(--accent-bg);color:var(--accent);font-weight:600}

/* catalog */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px 15px;
  display:flex;flex-direction:column;gap:9px;text-align:left;transition:box-shadow .12s,border-color .12s}
.card:hover{box-shadow:var(--shadow);border-color:var(--line2)}
.card h3{font-size:15px;font-weight:700;line-height:1.25}
.card .alias{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent);margin-top:-5px}
.card p{margin:0;font-size:12.8px;color:var(--ink2);line-height:1.5}
.card .foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--line);display:flex;gap:6px;
  flex-wrap:wrap;align-items:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.42);backdrop-filter:blur(2px);z-index:60}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:var(--surface);
  border-left:1px solid var(--line);z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dHead{padding:18px 24px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.dHead .row{display:flex;align-items:flex-start;gap:12px}
.dHead h3{font-size:18px;font-weight:700;flex:1;margin-top:6px}
.dHead .alias{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);margin-top:3px}
.dHead .close{font-size:20px;line-height:1;color:var(--ink3);padding:2px 6px;border-radius:5px}
.dHead .close:hover{background:var(--surface3);color:var(--ink)}
.dHead .when{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);margin-top:8px;font-weight:500}
.dBody{overflow-y:auto;padding:20px 24px 48px}
.dBody .lead{font-size:14px;line-height:1.6;margin:0 0 20px;color:var(--ink)}
.facts{display:grid;gap:13px;margin-bottom:22px}
.fact{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.fact dt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);padding-top:3px}
.fact dd{margin:0;font-size:13px;color:var(--ink2);line-height:1.5}
.covers{display:flex;flex-wrap:wrap;gap:5px}
.covers span{padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);
  font-size:11.5px;color:var(--ink2)}
.dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dates button{padding:4px 9px;border-radius:5px;border:1px solid var(--line2);background:var(--surface2);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2)}
.dates button:hover{border-color:var(--rc);color:var(--rc)}
.dates button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.note{padding:9px 12px;border-radius:5px;background:var(--accent-bg);color:var(--ink2);
  font-size:12.5px;border-left:2px solid var(--accent);margin-bottom:18px}

.hint{font-size:12.5px;color:var(--ink2);margin:0 0 16px;max-width:66ch}
.empty{padding:60px 20px;text-align:center;color:var(--ink3);font-size:14px}
footer.fine{margin-top:36px;border-top:1px solid var(--line);padding-top:14px;max-width:74ch;
  font-size:12px;color:var(--ink3);line-height:1.6}
@media (max-width:880px){
  main{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
  .pane{padding:16px}.mstrip{top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="topRow">
    <div class="brand">
      <h1>Helix Bootcamp Calendar</h1>
      <p>Partner technical enablement — scheduled delivery dates by region</p>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="cal" aria-selected="true">Calendar</button>
    <button class="tab" role="tab" data-view="tl" aria-selected="false">Timeline</button>
    <button class="tab" role="tab" data-view="list" aria-selected="false">All dates<i id="ctList"></i></button>
    <button class="tab" role="tab" data-view="cat" aria-selected="false">Bootcamps<i id="ctCat"></i></button>
  </div>
</header>

<main>
  <aside id="filters"></aside>
  <div class="pane" id="pane"></div>
</main>
<div id="drawerRoot"></div>

  </div>
  <div class="fgroup">
    <div class="eyebrow">Fiscal year <button class="clr" data-clear="fy">clear</button></div>
    <div class="chips">${FYS.map(f=>{const n=pool.filter(s=>s.fy===f).length;
      return `<button class="chip" data-f="fy" data-v="${f}" aria-pressed="${state.fy.has(f)}"${n?'':' disabled style="opacity:.4"'}>${f}<span class="ct">${n}</span></button>`}).join('')}</div>
  </div>
  <button class="reset" id="reset">Reset filters</button>
  <p class="legend"><b style="color:var(--ink2)">Region</b> is the timezone cohort a session is run for — APAC, EMEA, AMER, or WW where a session is open worldwide. A session shown as APAC/EMEA runs at a time that suits both.</p>`;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f,v=b.dataset.v;
    if(f==='when')state.when=v; else state[f].has(v)?state[f].delete(v):state[f].add(v);
    landed=false; render();
  });
  el.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{state[b.dataset.clear].clear();render()});
  el.querySelector('#reset').onclick=()=>{state.b.clear();state.r.clear();state.fy.clear();state.when='up';landed=false;render()};
}

function renderKPIs(v){
  const up=DATA.s.filter(s=>!s.past&&matchesNoWhen(s));
  const next=up.map(s=>s.d).sort()[0];
  const k=[[v.length,state.when==='past'?'Delivered':state.when==='up'?'Upcoming':'Sessions'],
           [new Set(v.map(s=>s.b)).size,'Bootcamps'],
           [next?fmt(next).replace(', '+D(next).getFullYear(),''):'—','Next date']];
  document.getElementById('kpis').innerHTML=k.map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');
  document.getElementById('ctList').textContent=v.length;
  document.getElementById('ctCat').textContent=CAT_ORDER.length;
}
function matchesNoWhen(s){
  if(state.b.size&&!state.b.has(s.b))return false;
  if(state.r.size&&!rTag(s).some(t=>state.r.has(t)))return false;
  if(state.fy.size&&!state.fy.has(s.fy))return false;
  return true;
}

function calendar(v){
  if(!v.length)return `<p class="empty">No sessions match these filters.</p>`;
  const byMonth=new Map();
  v.forEach(s=>{const k=s.d.slice(0,7);(byMonth.get(k)||byMonth.set(k,[]).get(k)).push(s)});
  const keys=[...byMonth.keys()].sort();
  let out=`<div class="mstrip">`+keys.map(k=>{const[y,m]=k.split('-').map(Number);
    return `<button data-jump="${k}"${k===PIN.slice(0,7)?' class="now"':''}>${MON3[m-1]} ${String(y).slice(2)}<b>${byMonth.get(k).length}</b></button>`}).join('')+`</div>
    <p class="hint">Each block is one scheduled delivery. Click it for the full course description, format and the other dates it runs on.</p>`;
  const first=D(keys[0]+'-01'),last=D(keys[keys.length-1]+'-01');
  let gap=0;
  for(let d=new Date(first);d<=last;d.setMonth(d.getMonth()+1)){
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const list=byMonth.get(key);
    if(!list){gap++;continue}
    if(gap){out+=`<p class="emptyMonths">${gap} month${gap>1?'s':''} with no scheduled sessions</p>`;gap=0}
    const y=d.getFullYear(),m=d.getMonth();
    const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    const byDay=new Map();
    list.forEach(s=>{const dd=D(s.d).getDate();(byDay.get(dd)||byDay.set(dd,[]).get(dd)).push(s)});
    out+=`<div class="monthHead" id="m-${key}"><h2>${MONTHS[m]}</h2><span class="yr">${y}</span>
      <span class="meta">${list.length} session${list.length>1?'s':''}</span></div>
      <div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div><div class="grid">`;
    for(let i=0;i<start;i++)out+=`<div class="cell pad"></div>`;
    for(let day=1;day<=days;day++){
      const dt=new Date(y,m,day),wk=dt.getDay()===0||dt.getDay()===6;
      const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const ss=(byDay.get(day)||[]).sort((a,b)=>a.b.localeCompare(b.b));
      out+=`<div class="cell${wk?' wknd':''}${iso===PIN?' today':''}"><span class="dnum">${day}</span>`;
      ss.forEach(s=>{out+=`<button class="sess${s.past?' isPast':''}" style="${rvars(s)}" data-id="${esc(s.id)}">
        <span class="nm">${esc(s.b)}</span><span class="sub">${esc(s.rl)}</span></button>`});
      out+=`</div>`;
    }
    out+=`</div>`;
  }
  return out;
}

function timeline(v){
  if(!v.length)return `<p class="empty">No sessions match these filters.</p>`;
  const keys=[...new Set(v.map(s=>s.d.slice(0,7)))].sort();
  const first=D(keys[0]+'-01'),last=D(keys[keys.length-1]+'-01');
  const cols=[];
  for(let d=new Date(first);d<=last;d.setMonth(d.getMonth()+1))
    cols.push({y:d.getFullYear(),m:d.getMonth(),key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`});
  const lanes=BOOTCAMPS.filter(b=>v.some(s=>s.b===b));
  const qEdge=c=>[3,6,9,0].includes(c.m);
  let out=`<p class="hint">One row per bootcamp, one column per month — the quickest way to see which months a course runs in and where two run close together. Vertical rules mark fiscal quarters.</p>
  <div class="tlWrap"><table class="tl"><thead><tr><th class="lane">Bootcamp</th>`;
  cols.forEach(c=>out+=`<th${qEdge(c)?' class="qEdge"':''}>${MON3[c.m]}<br>${String(c.y).slice(2)}</th>`);
  out+=`</tr></thead><tbody>`;
  lanes.forEach(b=>{
    out+=`<tr><th class="lane">${esc(b)}</th>`;
    cols.forEach(c=>{
      const ss=v.filter(s=>s.b===b&&s.d.slice(0,7)===c.key).sort((a,z)=>a.d.localeCompare(z.d));
      out+=`<td${qEdge(c)?' class="qEdge"':''}>`;
      if(ss.length)out+=`<div style="display:flex;gap:3px">`+ss.map(s=>
        `<button class="node${s.past?' isPast':''}" style="${rvars(s)};flex:1" data-id="${esc(s.id)}"
          title="${esc(b)} · ${fmt(s.d)} · ${esc(s.rl)}"><span class="bub"></span><span class="dd">${D(s.d).getDate()}</span></button>`).join('')+`</div>`;
      out+=`</td>`;
    });
    out+=`</tr>`;
  });
  return out+`</tbody></table></div>`;
}

const COLS=[['d','Date'],['b','Bootcamp'],['rl','Region'],['fy','Fiscal quarter'],['past','Status']];
function list(v){
  if(!v.length)return `<p class="empty">No sessions match these filters.</p>`;
  const rows=[...v].sort((a,b)=>{
    const k=state.sort,av=a[k],bv=b[k];
    return ((av>bv)-(av<bv))*state.dir||a.d.localeCompare(b.d)});
  return `<p class="hint">Every scheduled date in one list. Click a row for the course description.</p>
  <div class="tblWrap"><table class="data"><thead><tr>${COLS.map(([k,l])=>
    `<th class="sortable" data-sort="${k}">${l}${state.sort===k?(state.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>`+
  rows.map(s=>`<tr class="clickable" data-id="${esc(s.id)}">
    <td class="mono">${DOW[D(s.d).getDay()]} · ${fmt(s.d)}</td>
    <td style="font-weight:600">${esc(s.b)}</td>
    <td><span class="pill" style="${rvars(s)}">${esc(s.rl)}</span></td>
    <td class="mono">${s.fy} ${s.q}</td>
    <td><span class="tag${s.past?'':' up'}">${s.past?'Delivered':'Upcoming'}</span></td></tr>`).join('')+
  `</tbody></table></div>`;
}

function catalog(){
  return `<p class="hint">The full bootcamp portfolio. Each card opens the course description, audience, duration and format.</p>
  <div class="cards">`+CAT_ORDER.map(b=>{
    const c=CATALOG[b]||{full:b,lead:''};
    const up=DATA.s.filter(s=>s.b===b&&!s.past).length;
    const regs=[...new Set(DATA.s.filter(s=>s.b===b).flatMap(s=>rTag(s)))];
    return `<button class="card" data-cat="${esc(b)}">
      <h3>${esc(c.full)}</h3>
      ${c.alias?`<div class="alias">${esc(c.alias)}</div>`:''}
      <p>${esc((c.lead||'').split('. ')[0])}.</p>
      <div class="foot">${c.unscheduled?`<span class="tag">Dates on request</span>`:
        `<span class="tag${up?' up':''}">${up?up+' upcoming date'+(up>1?'s':''):'No upcoming dates'}</span>`}
        ${regs.map(r=>`<span class="pill" style="--rc:var(--${r.toLowerCase()});--rbg:var(--${r.toLowerCase()}-bg)">${r}</span>`).join('')}
        ${c.duration?`<span class="tag">${esc(c.duration.split(' · ')[0])}</span>`:''}</div>
    </button>`}).join('')+`</div>`;
}

function drawer(bootcamp,sessionId){
  const c=CATALOG[bootcamp]||{full:bootcamp};
  const s=sessionId?DATA.s.find(x=>x.id===sessionId):null;
  const all=DATA.s.filter(x=>x.b===bootcamp).sort((a,z)=>a.d.localeCompare(z.d));
  const up=all.filter(x=>!x.past), past=all.filter(x=>x.past);
  const sv=s?rvars(s):'--rc:var(--ww);--rbg:var(--ww-bg)';
  const root=document.getElementById('drawerRoot');
  root.innerHTML=`<div class="scrim" data-close></div>
  <aside class="drawer" style="${sv}" role="dialog" aria-modal="true" aria-label="${esc(c.full)}">
    <div class="dHead"><div class="row"><div style="flex:1">
      ${s?`<span class="pill" style="${sv}">${esc(s.rl)}</span>`:''}
      <h3>${esc(c.full)}</h3>
      ${c.alias?`<div class="alias">${esc(c.alias)}</div>`:''}
      ${s?`<div class="when">${DOW[D(s.d).getDay()]} · ${fmt(s.d)} · ${s.fy} ${s.q}${s.past?' · delivered':''}</div>`:''}
    </div><button class="close" data-close aria-label="Close">×</button></div></div>
    <div class="dBody">
      ${c.unscheduled?`<div class="note">${esc(c.unscheduled)}</div>`:''}
      ${s&&s.rs!=='banner'?`<div class="note">Region for this date is provisional — confirm with your partner contact before planning travel or shift cover.</div>`:''}
      <p class="lead">${esc(c.lead||'Course description to follow.')}</p>
      <dl class="facts">
        ${c.audience?`<div class="fact"><dt>Who it's for</dt><dd>${esc(c.audience)}</dd></div>`:''}
        ${c.duration?`<div class="fact"><dt>Duration</dt><dd>${esc(c.duration)}</dd></div>`:''}
        ${c.format?`<div class="fact"><dt>Format</dt><dd>${esc(c.format)}</dd></div>`:''}
      </dl>
      ${c.covers?`<div class="eyebrow" style="margin-bottom:8px">What it covers</div>
        <div class="covers">${c.covers.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
      ${up.length?`<div class="eyebrow" style="margin:24px 0 0">Upcoming dates</div>
        <div class="dates">${up.map(x=>`<button data-id="${esc(x.id)}" aria-current="${x.id===sessionId}"
          style="${rvars(x)}">${fmt(x.d)} · ${esc(x.rl)}</button>`).join('')}</div>`:
        (c.unscheduled?'':`<div class="eyebrow" style="margin:24px 0 0">Upcoming dates</div>
        <p style="font-size:12.5px;color:var(--ink3);margin:8px 0 0">None currently scheduled.</p>`)}
      ${past.length?`<div class="eyebrow" style="margin:22px 0 0">Previously delivered</div>
        <div class="dates">${past.slice(-8).map(x=>`<button data-id="${esc(x.id)}" aria-current="${x.id===sessionId}"
          style="${rvars(x)};opacity:.7">${fmt(x.d)} · ${esc(x.rl)}</button>`).join('')}
          ${past.length>8?`<span class="tag" style="align-self:center">+${past.length-8} earlier</span>`:''}</div>`:''}
    </div></aside>`;
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  root.querySelectorAll('.dates button').forEach(b=>b.onclick=()=>drawer(bootcamp,b.dataset.id));
  root.querySelector('.close').focus();
  document.body.style.overflow='hidden';
}
function close(){document.getElementById('drawerRoot').innerHTML='';document.body.style.overflow=''}
addEventListener('keydown',e=>{if(e.key==='Escape')close()});

const FINE=`<footer class="fine">Dates and regions are taken from the current partner enablement schedule and are subject to change; sessions occasionally move by a day or a week. Course durations are typical rather than contractual. To register, or to ask about a bootcamp with no dates listed, contact your Partner Success manager.</footer>`;

let landed=false;
function render(){
  const v=vis();
  renderFilters(); renderKPIs(v);
  const pane=document.getElementById('pane');
  pane.innerHTML=(state.view==='cal'?calendar(v):state.view==='tl'?timeline(v):
                  state.view==='list'?list(v):catalog())+FINE;
  pane.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>{
    const s=DATA.s.find(x=>x.id===n.dataset.id); if(s)drawer(s.b,s.id)});
  pane.querySelectorAll('[data-cat]').forEach(n=>n.onclick=()=>drawer(n.dataset.cat,null));
  pane.querySelectorAll('[data-sort]').forEach(n=>n.onclick=()=>{
    const k=n.dataset.sort;
    if(state.sort===k)state.dir*=-1;else{state.sort=k;state.dir=1}
    render()});
  pane.querySelectorAll('[data-jump]').forEach(n=>n.onclick=()=>{
    const t=document.getElementById('m-'+n.dataset.jump);
    if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})});
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===state.view));
  if(state.view==='cal'&&!landed){
    landed=true;
    const t=document.getElementById('m-'+PIN.slice(0,7));
    if(t)t.scrollIntoView({behavior:'auto',block:'start'});
  }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.view=t.dataset.view;render()});
render();
</script>
